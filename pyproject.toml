[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-tagging-dl"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "jetnet>=0.2.2",
    "hydra-core>=1.3.2",
    "torchmetrics>=1.0.0",
    "scikit-learn>=1.2.0",
    "numpy<2.0.0",    
    "pyarrow<17.0.0",     
    "matplotlib>=3.7.0",
    "tensorboard>=2.12.0",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]